<body><div class="shell"><aside class="story"><div class="story-brand"><span class="story-seal">戏</span><div>有戏新声<br><small>YOUXI XINSHENG</small></div></div><span class="kicker">让热爱，从这里登台</span><h1>一段戏词，<br>一次新声。</h1><p>为戏曲爱好者，留一处创作的地方。<br>从灵感到作品，从专业点评到下一次登台。</p><div class="line"></div><ul><li><b>01</b><span>提交原创 · 让老师听见</span></li><li><b>02</b><span>词谱工坊 · 为灵感起笔</span></li><li><b>03</b><span>个人舞台 · 被看见，被回应</span></li></ul><footer>微信原生开发版配套体验页 · v0.2.0<br>本机保存 / 可切换投稿、专家、运营角色<br>示例人物、积分与培训安排仅供开发验收。</footer></aside><div class="device"><div class="devbar"><span>本地开发版 · 离线模板创作</span><label>身份<select id="actor" aria-label="切换开发体验身份"></select></label></div><div class="topnav"><button id="back" data-action="back" aria-label="返回首页" hidden>←</button><span id="identity">正在载入</span><span class="weixin-capsule" aria-hidden="true">··· │ ◉</span></div><main class="main" id="main"><div class="empty">正在打开你的创作舞台…</div></main><nav class="bottom-nav" aria-label="主要导航"><button data-nav="home" class="active"><i>⌂</i>新声</button><button data-nav="works"><i>▤</i>作品</button><button data-nav="create"><i>♫</i>创作</button><button data-nav="profile"><i>○</i>我的</button></nav></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div><div id="working" class="working" hidden>正在处理…</div><script>(function(){'use strict';const modules={"miniprogram/lib/model.js":function(module,exports,require){
const GENRES = ['豫剧', '京剧', '越剧', '黄梅戏', '昆曲', '评剧', '其他'];
const TYPES = [{ id: 'lyrics', label: '原创戏词', cost: 30 }, { id: 'score', label: '曲谱草稿', cost: 120 }, { id: 'both', label: '词谱一体', cost: 140 }];
const DIMENSIONS = [
  { key: 'originality', label: '原创与主题', weight: .2 },
  { key: 'tradition', label: '剧种与文化', weight: .2 },
  { key: 'completeness', label: '文学音乐完整度', weight: .25 },
  { key: 'performability', label: '可唱可演性', weight: .2 },
  { key: 'potential', label: '传播与孵化潜力', weight: .15 }
];
const STATUS = { submitted: '待受理', reviewing: '专家评审中', needs_third: '待第三位复核', approved: '评审通过', revision: '建议修改', rejected: '未受理', incubating: '孵化中' };
const EXTENSIONS = ['txt', 'pdf', 'png', 'jpg', 'jpeg', 'mp3', 'wav', 'm4a', 'mp4', 'mov', 'xml', 'musicxml', 'mid', 'midi'];
const AGREEMENT_VERSION = 'dev-2026-09-19';
const POLICY = { welcomePoints: 300, approvalPoints: 500, incubationPoints: 500, passScore: 80, incubationScore: 90, minDimension: 60, disputeGap: 15, jobTimeoutMs: 300000 };
class DomainError extends Error {
  constructor(code, message) { super(message); this.code = code; this.name = 'DomainError'; }
}
function assert(condition, code, message) { if (!condition) throw new DomainError(code, message); }
function text(value, max, label, min = 0) {

  DIMENSIONS.forEach(d => assert(Number.isInteger(scores[d.key]) && scores[d.key] >= 0 && scores[d.key] <= 100, 'VALIDATION', '每项评分需为0—100的整数'));
  return Math.round(DIMENSIONS.reduce((sum, d) => sum + scores[d.key] * d.weight, 0) * 10) / 10;
